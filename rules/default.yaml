version: "1"
rules:
  - id: failed-authentication-burst
    name: Repeated failed authentication
    severity: high
    description: Multiple failed logins from the same user and source IP.
    window_minutes: 15
    threshold: 5
    group_by: [actor_user_name, src_ip]
    match:
      class_uid: {eq: 3002}
      status_id: {eq: 2}

  - id: critical-vulnerability-exposure
    name: Critical vulnerability finding
    severity: critical
    description: A critical severity finding requiring triage.
    window_minutes: 60
    threshold: 1
    group_by: [device_uid, resource_uid]
    match:
      severity_id: {gte: 5}
      message: {contains: cve-}

  - id: suspicious-admin-egress
    name: Suspicious privileged network egress
    severity: high
    description: Repeated privileged traffic to a non-standard destination port.
    window_minutes: 10
    threshold: 3
    group_by: [actor_user_name, src_ip, dst_ip, dst_port]
    match:
      class_uid: {eq: 4001}
      dst_port: {in: [4444, 8081, 8443]}
